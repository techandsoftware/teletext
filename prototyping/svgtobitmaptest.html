<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <script src="hqx.min.js"></script>
    <script>
        function loaded(img) {
            document.body.appendChild( hqx(img, 2) );
            document.body.appendChild( hqx(img, 3) );
            document.body.appendChild( hqx(img, 4) );
        }
    </script>
    <img src="engineering.svg" id="page" onload="loaded(this);">
    <script>
        debugger;
        const img = document.querySelector('#page');
        const px = getImagePixels( img, 0, 0, img.width, img.height ).data;
        console.dir(px);

        function getImagePixels( image, x, y, width, height) {
            var canvas = document.createElement('canvas');
            var ctx = canvas.getContext('2d');

            var ratio = getVendorAttribute( ctx, 'backingStorePixelRatio' ) || 1;
            ctx.getImageDataHD = getVendorAttribute( ctx, 'getImageDataHD' );

            var realWidth = image.width / ratio,
                realHeight = image.height / ratio;

            canvas.width = Math.ceil( realWidth );
            canvas.height = Math.ceil( realHeight );

            ctx.drawImage( image, 0, 0, realWidth, realHeight );

            return (ratio === 1)
                ? ctx.getImageData( x, y, width, height )
                : ctx.getImageDataHD( x, y, width, height );
        }

        function getVendorAttribute ( el, attr ) {
            var uc = attr.charAt(0).toUpperCase() + attr.substr(1);
            return el[attr] || el['ms'+uc] || el['moz'+uc] || el['webkit'+uc] || el['o'+uc];
        };


    </script>
</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>title</title>
    <script src="dist/appbundle.js" type="module">
    </script>
    <style>
        @font-face {
            font-family: 'Unscii';
            src: url('fonts/unscii-16.woff') format('woff'), 
                url('fonts/unscii-16.ttf') format('truetype'),
                url('fonts/unscii-16.otf') format('opentype');
            unicode-range: U+20, U+2022, U+2500, U+2502, U+250C, U+2510, U+2514, U+2518, U+251C, U+251D, U+2524, U+2525, U+252C, U+252F, U+2534, U+2537, U+253C, U+253F, U+2588, U+258C, U+2590, U+2592, U+25CB, U+25CF, U+25E2-25E5, U+2B60-2B63, U+1FB00-1FB70, U+1FB75, U+1FBA0-1FBA7;
            -webkit-font-smoothing: none;
            font-smooth: never;
        }
        @keyframes blink {
            66% {
                visibility: hidden;
            }
            to {
                visibility: hidden;
            }
        }
        @keyframes fancyblink {
            66% {
                filter: none;
                opacity: 1;
            }
            to {
                xvisibility: hidden;
                filter: blur(1px);
                opacity: 0;
            }
        }
        .mosaic {
            font-family: 'Unscii';
            font-size: 10.3px;  /* FUDGE 0.3px to close small gaps vertically */
        }
        .mosaic_separated {
            font-family: 'Unscii';
            font-size: 9.2px;
        }
        .flash {
            /* animation: blink 2s steps(3, start) infinite; */
            animation: blink 2s ease-in infinite;
        }
        svg {
            background-color: black;
        }
        body {
            background-color: #040;
        }
    </style>
</head>

<body>
</body>

</html>

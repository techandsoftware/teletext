<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>title</title>
    </script>
    <style>
        body {
            background-color: #040;
            font-size: 30px;
            color: white;
        }
    </style>
    <script type="module">
        import { teletextjs, Level } from './dist/teletextjs.js';
        import { DemoApp } from './src/DemoApp.js';
    (() => {
        teletextjs.showTestPage();
        const demo = new DemoApp(teletextjs);

        const levels = Object.keys(Level);
        let levelIndex = 1;
        const KEY_EVENTS = {
            '?': 'ttx.reveal',
            'm': 'ttx.mix',
            's': 'ttx.subtitlemode',
        };
        window.addEventListener('keypress', e => {
            switch (e.key) {
                case '?':
                case 'm':
                case 's':
                    window.dispatchEvent(new Event(KEY_EVENTS[e.key]));
                    break;
                case 'l':
                    levelIndex++;
                    if (levelIndex == levels.length) levelIndex = 0;
                    teletextjs.setLevel(Level[levels[levelIndex]]);
                    break;
                case 't':
                    teletextjs.showTestPage();
                    break;
                case 'x':
                    teletextjs.showRandomisedPage();
                    break;
                case 'c': // for cells
                    teletextjs.toggleGrid();
                    break;
                case 'd':
                    debugger;
                    demo.setPageRows();
                    break;
                default:
            }
        });
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('revealButton').addEventListener('click', () => {
                window.dispatchEvent(new Event('ttx.reveal'));
            });
            document.getElementById('levelSelect').addEventListener('input', e => {
                teletextjs.setLevel(Level[e.target.value]);
            });
        });
    })();
    </script>
</head>

<body>
    <div id="teletextscreen"></div>

    <input type="button" value="REVEAL (?)" id="revealButton">

    <hr>

    <label for="levelSelect">Level: </label>
    <select id="levelSelect" autocomplete="false">
        <option>0</option>
        <option selected>1</option>
        <option>1.5</option>
    </select>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>title</title>
    <script src="dist/appbundle.js" type="module">
    </script>
    <style>
        body {
            background-color: #040;
        }
        input {
            font-size: 30px;
        }
    </style>
    <script>
    (() => {
        "use strict";
        const KEY_EVENTS = {
            '?': 'ttx.reveal',
            'm': 'ttx.mix',
            's': 'ttx.subtitlemode',
            'l': 'ttx.dev.level',
            't': 'ttx.dev.testpage',
            'x': 'ttx.dev.randompage',
            'c': 'ttx.dev.grid', // c for cells
        };
        window.addEventListener('keypress', e => {
            if (e.key in KEY_EVENTS) window.dispatchEvent(new Event(KEY_EVENTS[e.key]));
        });
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('revealButton').addEventListener('click', () => {
                window.dispatchEvent(new Event('ttx.reveal'));
            });
        });
    })();
    </script>
</head>

<body>
    <div id="teletextscreen"></div>

    <input type="button" value="REVEAL (?)" id="revealButton">
</body>

</html>

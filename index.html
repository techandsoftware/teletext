<!-- This page is for development mode with Vite's live reload;
     launch with `npm run dev` -->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>@techandsoftare/teletext - dev page</title>
  <style>
    body {
      background-color: darkblue;
      color: white;
    }

    td {
      padding: 5px;
    }
    a {
      color: cyan;
    }
  </style>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script type="module">
    // minimum code to load and show a built-in test page
    import { Teletext, Level } from '/lib/app.js';
    const t = Teletext();
    t.addTo('#teletextscreen');
    t.setDefaultG0Charset('g0_latin__english');
    t.showTestPage('ENGINEERING');
  </script>


  <script type="module">
    // this code is to handle key events and the reveal button below. This demonstrates using events
    const KEY_EVENTS = {
      '?': 'ttx.reveal',
      'm': 'ttx.mix',
      's': 'ttx.subtitlemode',
    };
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('revealButton').addEventListener('click', () => {
        window.dispatchEvent(new Event(KEY_EVENTS['?']));
      });
    });
    window.addEventListener('keypress', e => {
      if (e.key in KEY_EVENTS)
        window.dispatchEvent(new Event(KEY_EVENTS[e.key]));
    });
  </script>

  <script nomodule>
    document.write("<p>Sorry, your browser needs to support ES6 module imports for this to work.</p>");
    console.debug("=========> If you need to support old browsers, you'll need to use the provided UMD module and transpile the code for your targetted browsers");
  </script>
</head>

<body>

  <div id="teletextscreen"></div>

  <input type="button" value="REVEAL" id="revealButton">

  <p>Key controls</p>
  <table>
    <tr>
      <td>?</td>
      <td>Toggle reveal</td>
    </tr>
    <tr>
      <td>m</td>
      <td>Toggle mix</td>
    </tr>
    <tr>
      <td>s</td>
      <td>Toggle subtitle (boxed) mode</td>
    </tr>
  </table>

  <p>See also: <a href="import_from_jsdelivr.html">Importing from jsdeliver</a> and <a href="import_lib_from_dist.html">Importing from local dist</a></p>
</body>

</html>

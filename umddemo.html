<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>title</title>
    <style>
        body {
            background-color: #040;
            font-size: 30px;
            color: white;
        }
    </style>
    <script src="./dist/teletextjs.umd.min.js">
    </script>
    <script>
    (() => {
        let levelIndex = 1;
        const KEY_EVENTS = {
            '?': 'ttx.reveal',
            'm': 'ttx.mix',
            's': 'ttx.subtitlemode',
        };
        window.addEventListener('keypress', e => {
            if (e.key in KEY_EVENTS)
                window.dispatchEvent(new Event(KEY_EVENTS[e.key]));
        });
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('revealButton').addEventListener('click', () => {
                window.dispatchEvent(new Event('ttx.reveal'));
            });
        });
        window.addEventListener("load", () => {
            console.log('here');
            teletextjs.teletextjs.addTo('#teletextscreen');
            teletextjs.teletextjs.showTestPage();
        });
    })();
    </script>
</head>

<body>
    <div id="teletextscreen"></div>

    <input type="button" value="REVEAL (?)" id="revealButton">

</body>

</html>
